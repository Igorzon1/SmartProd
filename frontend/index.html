<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Início — SmartProd</title>
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <nav id="menu" class="menu" aria-label="Menu principal"></nav>
    <main class="container">
      <p class="eyebrow">Sua padaria, em sintonia</p>
      <h1 id="saudacao"></h1>
      <p id="perfil" class="subtitle"></p>
      <p id="aviso" class="aviso" hidden>
        Seu perfil não tem acesso à página solicitada.
      </p>
      <section id="primeiros-passos" class="card primeiros-passos" aria-labelledby="t-primeiros" hidden>
        <h2 id="t-primeiros">Primeiros passos</h2>
        <p class="hint">Siga esta ordem para chegar à primeira fornada no sistema.</p>
        <ol id="passos-lista" class="passos-lista"></ol>
      </section>
      <section class="hero">
        <h2 id="titulo"></h2>
        <p id="descricao"></p>
      </section>
      <section class="grid" id="atalhos" aria-label="Acessos rápidos"></section>
    </main>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
