# Produção: PostgreSQL em nuvem. Credenciais SEMPRE por variável de ambiente ou SSM Parameter Store (o repositório é público).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}

app:
  db:
    iam-auth: ${DB_IAM_AUTH:false}
    iam-region: ${DB_IAM_REGION:${AWS_REGION:us-east-2}}
  jwt:
    # Em produção, prefira JWT_SECRET_SSM_PARAM (SecureString no SSM Parameter Store); JWT_SECRET segue como fallback.
    secret: ${JWT_SECRET:}
    ssm-parameter: ${JWT_SECRET_SSM_PARAM:}
    ssm-region: ${AWS_REGION:us-east-2}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    diskspace:
      path: /tmp
