name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # Sem filtro de paths: o check "sintaxe-js" precisa aparecer em todo PR para poder ser obrigatório.
  pull_request:

jobs:
  sintaxe-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O frontend usa <script type="module">, então todo .js é conferido como módulo ES.
      # Pega, por exemplo, um `import` colocado dentro de um `if` ou de uma função.
      - name: Sintaxe dos arquivos JavaScript
        run: |
          falhas=0
          while IFS= read -r arquivo; do
            if ! saida=$(node --input-type=module --check < "$arquivo" 2>&1); then
              echo "::error file=$arquivo::$(echo "$saida" | grep -m1 'SyntaxError')"
              falhas=$((falhas + 1))
            fi
          done < <(find frontend -name '*.js' -not -path '*/node_modules/*')
          echo "$falhas arquivo(s) com erro de sintaxe"
          [ "$falhas" -eq 0 ]
